server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # Метрики доступны внутри инфраструктуры, но не через публичный прокси.
    location = /api/metrics { return 403; }

    # Callback содержит code и state; стандартный access_log пишет query string.
    location = /api/auth/github/callback {
        proxy_pass http://api:8000/auth/github/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    location /api/ {
        # Завершающий / убирает префикс /api перед передачей запроса в FastAPI.
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /ws/ {
        # Для WebSocket сохраняем исходный путь и передаём заголовки Upgrade.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
        access_log off; # Не записываем query string: позднее в нём будет токен.
    }

    # Адрес /documents/<uuid> обрабатывает React, отдельного HTML-файла для него нет.
    location / { try_files $uri $uri/ /index.html; }
}
