# Устанавливается на VPS после получения сертификата. Заменить cowrite.example.org.
server {
    listen 80;
    server_name cowrite.example.org;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name cowrite.example.org;
    ssl_certificate /etc/letsencrypt/live/cowrite.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cowrite.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    # Внешний прокси не пишет токены, OAuth code/state или fragment.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # Перезаписываем пользовательские forwarded-заголовки, а не дополняем их.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
