name: cowrite

x-backend: &backend
  image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
  env_file: .env.production
  restart: unless-stopped
  init: true

services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    configs:
      - source: frontend_nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--forwarded-allow-ips", "*"]
    volumes: [exports:/app/exports]
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["celery", "-A", "app.worker:celery", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes: [exports:/app/exports]
    healthcheck:
      test: ["CMD", "celery", "-A", "app.worker:celery", "inspect", "ping", "--timeout=3"]
      interval: 30s
      timeout: 10s
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  beat:
    <<: *backend
    command: ["celery", "-A", "app.worker:celery", "beat", "--loglevel=INFO", "--schedule=/tmp/cowrite-beat"]
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    profiles: [tools]
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env.production
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.8.0
    restart: unless-stopped
    configs:
      - source: prometheus
        target: /etc/prometheus/prometheus.yml
    volumes: [prometheus:/prometheus]

volumes:
  postgres:
  redis:
  exports:
  prometheus:

configs:
  frontend_nginx:
    file: ./infra/nginx-frontend-production.conf
  prometheus:
    content: |
      global:
        scrape_interval: 15s
      scrape_configs:
        - job_name: cowrite
          static_configs:
            - targets: [api:8000]
