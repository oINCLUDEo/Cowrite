[project]
name = "cowrite-backend"
version = "0.1.0"
description = "Cowrite collaborative document editor API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosmtplib>=4,<6",
    "alembic>=1.15,<2",
    "argon2-cffi>=25,<26",
    "asyncpg>=0.30,<1",
    "celery[redis]>=5.5,<6",
    "email-validator>=2,<3",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-fastapi-instrumentator>=7,<8",
    "pycrdt>=0.12,<1",
    "pycrdt-websocket>=0.16,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.10,<3",
    "redis>=5,<8",
    "reportlab>=4,<5",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25,<27",
    "uvicorn>=0.34,<1",
    "websockets>=15,<17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: requires an explicitly configured test PostgreSQL database"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.13"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "jsonschema>=4,<5",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "types-jsonschema>=4,<5",
    "types-reportlab>=5.1.0.20261104",
]
