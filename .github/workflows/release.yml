name: Publish and deploy
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
permissions:
  contents: read
  packages: write
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: release
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.images.outputs.prefix }}-backend:${{ steps.release.outputs.sha }}
            ${{ steps.images.outputs.prefix }}-backend:latest
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ steps.images.outputs.prefix }}-frontend:${{ steps.release.outputs.sha }}
            ${{ steps.images.outputs.prefix }}-frontend:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - name: Configure verified SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Transfer deployment files and deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          ssh "$USER@$HOST" 'mkdir -p /opt/cowrite/infra'
          scp docker-compose.prod.yml "$USER@$HOST:/opt/cowrite/"
          scp infra/deploy.sh "$USER@$HOST:/opt/cowrite/infra/"
          scp infra/nginx-frontend-production.conf "$USER@$HOST:/opt/cowrite/infra/"
          ssh "$USER@$HOST" "bash /opt/cowrite/infra/deploy.sh '$SHA'"
